<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenEvidence Shortcuts</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2933;
        background: #ffffff;
      }

      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      body {
        width: 260px;
        margin: 0;
        padding: 12px;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 16px;
        line-height: 22px;
      }

      p {
        margin: 0 0 12px;
        color: #52616b;
        font-size: 13px;
        line-height: 18px;
      }

      button {
        width: 100%;
        min-height: 38px;
        border: 1px solid #a7b5bf;
        border-radius: 6px;
        background: #ffffff;
        color: #1f2933;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
      }

      button:hover {
        background: #eef6f5;
      }
    </style>
  </head>
  <body>
    <h1>OpenEvidence Shortcuts</h1>
    <p>Use right-click or Alt+Shift+O on OpenEvidence to insert prompts.</p>
    <button id="openOptionsButton" type="button">Open Prompt Manager</button>
    <script src="popup.js"></script>
  </body>
</html>
